<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vrMEr Voyager Layout Viewer</title>
  <style>
    :root {
      --bg: #f3f4ef;
      --panel: #fcfcf8;
      --ink: #1e1f24;
      --muted: #6a6d75;
      --stroke: #cfd3c6;
      --accent: #0f766e;
      --dead: #ede9e2;
      --trans: #f4f5f7;
      --key: #ffffff;
      --shadow: 0 8px 24px rgba(20, 22, 30, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, #ffffff 0%, rgba(255, 255, 255, 0) 65%),
        radial-gradient(900px 500px at 90% 120%, #ecefe6 0%, rgba(236, 239, 230, 0) 70%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px;
    }

    .wrap {
      max-width: 1300px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--stroke);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .controls {
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
    }

    .layer-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab {
      border: 1px solid var(--stroke);
      background: white;
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      letter-spacing: 0.02em;
      cursor: pointer;
    }

    .tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .layout {
      padding: 14px;
      overflow-x: auto;
    }

    .board {
      position: relative;
      width: 1130px;
      height: 450px;
      margin: 0 auto;
      border-radius: 14px;
      background:
        linear-gradient(180deg, #fbfbf9 0%, #f4f6f0 100%);
      border: 1px solid #d8ddcf;
    }

    .split-gap {
      position: absolute;
      left: 50%;
      top: 48px;
      transform: translateX(-50%);
      width: 84px;
      height: 314px;
      border-radius: 16px;
      background: linear-gradient(180deg, #f6f7f2, #eef1e8);
      border: 1px dashed #d0d6c7;
      opacity: 0.9;
    }

    .key {
      position: absolute;
      width: 64px;
      height: 58px;
      border-radius: 12px;
      border: 1px solid #cfd3c6;
      background: var(--key);
      box-shadow: 0 3px 8px rgba(18, 20, 25, 0.08);
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 6px 7px;
      transition: transform 120ms ease;
    }

    .key:hover {
      transform: translateY(-2px);
    }

    .slot {
      font-size: 10px;
      color: #8d9199;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .label {
      align-self: end;
      font-size: 12px;
      line-height: 1.1;
      font-weight: 600;
      color: #202327;
      word-break: break-word;
    }

    .key.dead {
      background: var(--dead);
      border-color: #d9d0c6;
      opacity: 0.75;
    }

    .key.trans {
      background: var(--trans);
      border-color: #dde0e6;
      opacity: 0.82;
    }

    .key.dead .label,
    .key.trans .label {
      color: #848890;
    }

    .key.mod { background: #ecf7f5; }
    .key.layer { background: #eef4ff; }
    .key.nav { background: #fef5ea; }

    .legend {
      padding: 12px 16px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .chip {
      border: 1px solid var(--stroke);
      border-radius: 999px;
      padding: 4px 10px;
      background: white;
    }

    .status {
      padding: 10px 16px 14px;
      color: #4b5563;
      font-size: 13px;
    }

    .activation {
      margin: 0 16px 12px;
      padding: 10px 12px;
      border: 1px solid #d8ddcf;
      border-radius: 12px;
      background: linear-gradient(180deg, #f9faf7 0%, #f3f5ef 100%);
      color: #374151;
      font-size: 13px;
    }

    .activation strong {
      color: var(--ink);
    }

    .key.activation-key {
      outline: 2px solid #0f766e;
      outline-offset: 2px;
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12), 0 3px 8px rgba(18, 20, 25, 0.08);
    }

    .activation-badge {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.12);
      color: #0f766e;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    @media (max-width: 900px) {
      body { padding: 12px; }
      .controls { gap: 8px; }
      .board { transform-origin: top left; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card controls">
      <div class="layer-tabs" id="layerTabs"></div>
      <div class="right-controls">
        <label><input id="hideDead" type="checkbox"> Hide KC_NO</label>
        <label><input id="hideTrans" type="checkbox"> Hide TRNS</label>
      </div>
    </div>

    <div class="card layout">
      <div class="board" id="board">
        <div class="split-gap" aria-hidden="true"></div>
      </div>
      <div class="activation" id="activation"></div>
      <div class="status" id="status"></div>
      <div class="legend">
        <span class="chip">Blue tint: Layer controls (OSL, LT, TO)</span>
        <span class="chip">Green tint: Mod-tap and one-shot mods</span>
        <span class="chip">Orange tint: Navigation and cursor actions</span>
        <span class="chip">Gray: TRNS or KC_NO</span>
        <span class="chip">Keyboard: Left/Right or Up/Down changes layer, 0-8 jumps to layer</span>
      </div>
    </div>
  </div>

      k38:{x:10,y:2.5}, k39:{x:11,y:2.25}, k40:{x:12,y:2}, k41:{x:13,y:2.25}, k42:{x:14,y:2.5}, k43:{x:15,y:2.5},

    const KEYMAP = {

        k06:"TRNS",k07:"DE_SECT",k08:"OSM(CTL)",k09:"OSM(SFT)",k10:"OSM(ALT)",k11:"OSM(GUI)",k32:"DE_QUES",k33:"DE_LPRN",k34:"DE_RPRN",k35:"DE_MINS",k36:"DE_TILD",k37:"TRNS",
        k12:"TRNS",k13:"DE_AT",k14:"OSM(CS)",k15:"OSM(AS)",k16:"OSM(GS)",k17:"DE_GRV",k38:"DE_PLUS",k39:"DE_PERC",k40:"DE_DLR",k41:"DE_HASH",k42:"DE_COLN",k43:"TRNS",
        k18:"TRNS",k19:"DE_UNDS",k20:"KC_NO",k21:"KC_NO",k22:"DE_SLSH",k23:"DE_ASTR",k44:"DE_BSLS",k45:"DE_PIPE",k46:"KC_NO",k47:"KC_NO",k48:"DE_SCLN",k49:"TRNS",
        k24:"KC_NO",k25:"TRNS",k50:"BSPC",k51:"KC_NO"
      },
      L3: {
        k00:"TRNS",k01:"TRNS",k02:"TAB",k03:"OSL(MAC_SHORT)",k04:"OSL(WIN_SHORT)",k05:"TRNS",k26:"OS_PREV",k27:"OS_PGUP",k28:"TRNS",k29:"OS_NEXT",k30:"TRNS",k31:"TRNS",
        k06:"TRNS",k07:"ESC",k08:"OSM(SFT)",k09:"OSM(ALT)",k10:"OSM(GUI)",k11:"TRNS",k32:"TRNS",k33:"LEFT",k34:"DOWN",k35:"UP",k36:"TRNS",k37:"TRNS",
        k12:"TRNS",k13:"OSM(CTL)",k14:"OS_COPY",k15:"OS_PASTE",k16:"OS_CUT",k17:"TRNS",k38:"TRNS",k39:"OS_PGDN",k40:"OS_HOME",k41:"OS_END",k42:"RIGHT",k43:"TRNS",
        k18:"TRNS",k19:"OS_UNDO",k20:"KC_NO",k21:"KC_NO",k22:"TRNS",k23:"TRNS",k44:"TRNS",k45:"TRNS",k46:"KC_NO",k47:"KC_NO",k48:"TRNS",k49:"TRNS",
        k24:"KC_NO",k25:"TRNS",k50:"TRNS",k51:"KC_NO"

        k06:"TRNS",k07:"OSM(CTL)",k08:"OS_COPY",k09:"OS_PASTE",k10:"OS_CUT",k11:"OS_SELALL",k32:"0",k33:"1",k34:"2",k35:"3",k36:"TRNS",k37:"TRNS",
        k12:"TRNS",k13:"OS_UNDO",k14:"OS_PREV",k15:"OS_NEXT",k16:"BSPC",k17:"DEL",k38:"TRNS",k39:"4",k40:"5",k41:"6",k42:"TRNS",k43:"TRNS",
        k18:"TRNS",k19:"OS_REDO",k20:"KC_NO",k21:"KC_NO",k22:",",k23:".",k44:"TRNS",k45:"TRNS",k46:"KC_NO",k47:"KC_NO",k48:"TRNS",k49:"APP",
        k24:"KC_NO",k25:".",k50:"TRNS",k51:"KC_NO"
      },
      L5: {
        k00:"TRNS",k01:"TRNS",k02:"RGB_S-",k03:"RGB_S+",k04:"RGB_SPD-",k05:"RGB_SPD+",k26:"SW_MAC",k27:"SW_WIN",k28:"TRNS",k29:"TRNS",k30:"TRNS",k31:"TRNS",
        k06:"RGB_TOG",k07:"LYR_CLR",k08:"MEDIA>>",k09:"MEDIASTOP",k10:"RGB_H-",k11:"RGB_H+",k32:"TRNS",k33:"TRNS",k34:"TRNS",k35:"TRNS",k36:"BOOT",k37:"TRNS",
        k12:"TRNS",k13:"TRNS",k14:"TRNS",k15:"HSV_0",k16:"HSV_74",k17:"HSV_169",k38:"TRNS",k39:"C-S-TAB",k40:"C-TAB",k41:"TRNS",k42:"TRNS",k43:"TRNS",
        k18:"TRNS",k19:"MEDIA<<",k20:"KC_NO",k21:"KC_NO",k22:"TRNS",k23:"TRNS",k44:"TRNS",k45:"TRNS",k46:"KC_NO",k47:"KC_NO",k48:"TRNS",k49:"TRNS",

      },

        k06:"TRNS",k07:"Spotlight",k08:"Finder Tab",k09:"Duplicate",k10:"Get Info",k11:"Rename",k32:"Move H",k33:"Move J",k34:"Move K",k35:"Move L",k36:"Fullscreen",k37:"TRNS",

      },

        k06:"TRNS",k07:"Task View",k08:"Emoji",k09:"Lock",k10:"TRNS",k11:"TRNS",k32:"LEFT",k33:"DOWN",k34:"RIGHT",k35:"Desk New",k36:"Desk Right",k37:"TRNS",
        k12:"TRNS",k13:"Explorer",k14:"OS_COPY",k15:"OS_PASTE",k16:"OS_CUT",k17:"OS_SELALL",k38:"TRNS",k39:"TRNS",k40:"TRNS",k41:"TRNS",k42:"Desk Close",k43:"TRNS",

    const board = document.getElementById("board");
    const tabs = document.getElementById("layerTabs");
    const activation = document.getElementById("activation");
    const status = document.getElementById("status");
    const hideDead = document.getElementById("hideDead");
    const hideTrans = document.getElementById("hideTrans");

    const X0 = 70;
    const Y0 = 40;
    const STEP = 62;

    let activeLayer = "L0";

    const ACTIVATION_SOURCES = {
      L0: { layer: "L0", slot: "default", label: "Default layer" },
      L1: { layer: "L1", slot: "default", label: "Default layer" },
      L2: { layer: "L0", slot: "k22", label: "OSL(SYM)" },
      L3: { layer: "L0", slot: "k23", label: "OSL(MOV)" },
      L4: { layer: "L0", slot: "k45", label: "LT(NUM,SPC)" },
      L5: { layer: "L0", slot: "k31", label: "TO(CONFIG)" },
      L6: { layer: "L0", slot: "k44", label: "OSL(FN)" },
      L7: { layer: "L3", slot: "k03", label: "OSL(MAC_SHORTCUTS)" },
      L8: { layer: "L3", slot: "k04", label: "OSL(WIN_SHORTCUTS)" }
    };

    function classify(label) {
      if (label === "KC_NO") return "dead";
      if (label === "TRNS") return "trans";
      if (label.startsWith("OSL(") || label.startsWith("LT(") || label.startsWith("TO(")) return "layer";
      if (label.startsWith("MT(") || label.startsWith("OSM(") || label.includes("SHIFT") || label.includes("CTRL")) return "mod";
      if (["LEFT","RIGHT","UP","DOWN","PGUP","PGDN","HOME","END","MS_UP","MS_LEFT","MS_RIGHT","MS_DOWN","WH_UP","WH_DOWN","WH_LEFT","WH_RIGHT"].includes(label)) return "nav";
      return "";
    }

    function pretty(label) {
      if (label === "KC_NO") return "REMOVED";
      return label;
    }

    function renderTabs() {
      tabs.innerHTML = "";
      for (const layer of LAYERS) {
        const btn = document.createElement("button");
        btn.className = "tab" + (layer.id === activeLayer ? " active" : "");
        btn.textContent = layer.id + " " + layer.name;
        btn.addEventListener("click", () => {
          activeLayer = layer.id;
          renderTabs();
          renderBoard();
        });
        tabs.appendChild(btn);
      }
    }

    function setActiveLayerByIndex(index) {
      if (index < 0 || index >= LAYERS.length) return;
      activeLayer = LAYERS[index].id;
      renderTabs();
      renderBoard();
    }

    function cycleLayer(direction) {
      const currentIndex = LAYERS.findIndex(layer => layer.id === activeLayer);
      if (currentIndex < 0) return;
      const nextIndex = (currentIndex + direction + LAYERS.length) % LAYERS.length;
      setActiveLayerByIndex(nextIndex);
    }

    function renderBoard() {
      const old = board.querySelectorAll(".key");
      old.forEach(k => k.remove());

      const map = KEYMAP[activeLayer];
      const activationSource = ACTIVATION_SOURCES[activeLayer] || null;
      let visibleCount = 0;
      let hiddenDead = 0;
      let hiddenTrans = 0;

      for (const slot of Object.keys(SLOT_COORDS)) {
        const label = map[slot] || "TRNS";
        if (hideDead.checked && label === "KC_NO") { hiddenDead++; continue; }
        if (hideTrans.checked && label === "TRNS") { hiddenTrans++; continue; }

        const { x, y } = SLOT_COORDS[slot];
        const key = document.createElement("div");
        key.className = "key " + classify(label);
        if (activationSource && activationSource.slot === slot) {
          key.classList.add("activation-key");
        }
        key.style.left = (X0 + x * STEP) + "px";
        key.style.top = (Y0 + y * STEP) + "px";

        const slotLine = document.createElement("div");
        slotLine.className = "slot";
        slotLine.textContent = slot;

        const text = document.createElement("div");
        text.className = "label";
        text.textContent = pretty(label);

        if (activationSource && activationSource.slot === slot) {
          const badge = document.createElement("div");
          badge.className = "activation-badge";
          badge.textContent = "activates current layer";
          text.appendChild(badge);
        }

        key.appendChild(slotLine);
        key.appendChild(text);
        board.appendChild(key);
        visibleCount++;
      }

      const layerName = LAYERS.find(l => l.id === activeLayer)?.name || activeLayer;
      if (activationSource) {
        const sourceLayerName = LAYERS.find(l => l.id === activationSource.layer)?.name || activationSource.layer;
        activation.innerHTML = "<strong>Entered by:</strong> " + sourceLayerName + " " + activationSource.slot + " · " + activationSource.label;
      } else {
        activation.textContent = "";
      }
      status.textContent = "Layer " + activeLayer + " " + layerName + " | visible keys: " + visibleCount +
        " | hidden KC_NO: " + hiddenDead + " | hidden TRNS: " + hiddenTrans;
    }

    hideDead.addEventListener("change", renderBoard);
    hideTrans.addEventListener("change", renderBoard);

    document.addEventListener("keydown", (event) => {
      if (event.metaKey || event.ctrlKey || event.altKey) return;

      const targetTag = event.target && event.target.tagName ? event.target.tagName.toUpperCase() : "";
      if (targetTag === "INPUT" || targetTag === "TEXTAREA" || targetTag === "SELECT") return;

      if (event.key === "ArrowRight" || event.key === "ArrowDown") {
        event.preventDefault();
        cycleLayer(1);
        return;
      }

      if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
        event.preventDefault();
        cycleLayer(-1);
        return;
      }

      if (/^[0-8]$/.test(event.key)) {
        event.preventDefault();
        setActiveLayerByIndex(Number(event.key));
      }
    });

    renderTabs();
    renderBoard();
  </script>
</body>
</html>
